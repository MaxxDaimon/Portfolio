<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Maxx Wever</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Self-contained styles so the page always renders, even if it's served
       from an unexpected URL where styles.css can't resolve. -->
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0B0B0D;
      color: #F2F2F0;
      font-family: 'Archivo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: .22em;
      color: #E5484D;
      margin: 0 0 24px;
    }
    h1 {
      font-size: clamp(72px, 18vw, 200px);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: .9;
      margin: 0;
    }
    h1 .dot { color: #E5484D; }
    p.msg {
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.5;
      color: #b5b5b0;
      max-width: 460px;
      margin: 28px 0 40px;
    }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn {
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: .06em;
      padding: 14px 24px;
      border-radius: 6px;
      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }
    .btn-primary { background: #E5484D; color: #0B0B0D; font-weight: 700; }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-ghost { border: 1px solid #2a2a2e; color: #F2F2F0; }
    .btn-ghost:hover { border-color: #E5484D; }
    .wordmark {
      position: fixed; top: 28px; left: 32px;
      font-weight: 800; font-size: 14px; letter-spacing: .16em; text-decoration: none; color: #F2F2F0;
    }
  </style>

  <!-- Analytics (GoatCounter, privacy-friendly) -->
  <script data-goatcounter="https://maxx.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

  <a href="index.html" class="wordmark">MAXX WEVER</a>

  <p class="code">ERROR 404 · PAGE NOT FOUND</p>
  <h1>404<span class="dot">.</span></h1>
  <p class="msg">This page doesn't exist, moved, or the link was mistyped. Let's get back on track.</p>

  <div class="actions">
    <a href="index.html" class="btn btn-primary">BACK HOME →</a>
    <a href="projects.html" class="btn btn-ghost">VIEW PROJECTS</a>
  </div>

</body>
</html>
